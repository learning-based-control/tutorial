name: Publish to GitHub Pages

# GitHub Pages serves the gh-pages branch. This mirrors main onto it on every push,
# so main stays the only branch anyone edits.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          touch .nojekyll
          git add -A
          git add -f .nojekyll
          git commit -qm "Publish ${GITHUB_SHA::7}" || true
          git push --force origin gh-pages
